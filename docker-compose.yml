services:
  php:
    build:
      dockerfile_inline: |
        FROM composer:2
        RUN install-php-extensions pdo_pgsql
    working_dir: /app
    volumes:
      - .:/app
      - composer-cache:/tmp/composer
    environment:
      COMPOSER_HOME: /tmp/composer
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      POSTGRES_VERSION: ${POSTGRES_VERSION:-14}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:${POSTGRES_VERSION:-14}
    environment:
      POSTGRES_DB: testing
      POSTGRES_PASSWORD: secret
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d testing"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  composer-cache:
