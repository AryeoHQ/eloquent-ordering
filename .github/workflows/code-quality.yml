name: Code Quality

# Jobs run on the AryeoHQ VPC CodeBuild runner, which can reach Artifactory, and run PHP in
# Docker through ./.github/actions/php, because the runner has no PHP of its own.

on:
  push:

concurrency:
  cancel-in-progress: true
  group: code-quality-${{ github.ref }}

jobs:
  code-style:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Install Composer dependencies
        run: php-ci composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: php-ci ./vendor/bin/testbench tooling:pint --test

  static-analysis:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Install Composer dependencies
        run: php-ci composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Testbench cache dir
        run: mkdir -p ./vendor/orchestra/testbench-core/laravel/bootstrap/cache

      - name: Run static analysis on application
        run: php-ci ./vendor/bin/testbench tooling:phpstan --memory-limit=4G --error-format=github

  dependency-analysis:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Install Composer dependencies
        run: php-ci composer install --prefer-dist --no-interaction --no-progress

      - name: Check dependencies
        run: php-ci ./vendor/bin/composer-dependency-analyser

  tests:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.5]
        laravel: [12.*, 13.*]
        postgres: [14, 16, 18]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - PG${{ matrix.postgres }} - ${{ matrix.os }}

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: testing
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d testing"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DB_CONNECTION: pgsql
      DB_HOST: localhost
      POSTGRES_VERSION: ${{ matrix.postgres }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php
        with:
          php_version: ${{ matrix.php }}
          coverage: pcov
          extensions: pdo_pgsql
          build_deps: libpq-dev

      - name: Apply the Laravel and Testbench constraints
        run: php-ci composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update

      - name: Install Composer dependencies
        run: php-ci composer update --no-interaction

      - name: List installed Composer dependencies
        run: php-ci composer show -D

      - name: Run tests
        run: php-ci ./vendor/bin/testbench package:test --coverage-cobertura coverage.xml

      - name: Code Coverage Report
        if: matrix.postgres == 16
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '75 90'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && matrix.postgres == 16
        with:
          recreate: true
          path: code-coverage-results.md
